name: Feature request
description: Suggest an improvement to DualSync.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Describe the behavior you want and any workaround you use now.
    validations:
      required: true
