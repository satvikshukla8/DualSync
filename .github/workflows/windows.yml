name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/build.ps1 -Package
      - uses: actions/upload-artifact@v7
        with:
          name: DualSync-0.1.0-alpha.6-win-x64
          path: |
            artifacts/DualSync-0.1.0-alpha.6-win-x64.zip
            artifacts/DualSync-0.1.0-alpha.6-win-x64.zip.sha256
          retention-days: 14
